name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Reference the copilot environment to access its secrets
    environment: copilot

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export secrets to environment
        run: |
          # Make secrets available in subsequent steps
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> $GITHUB_ENV
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl wget git build-essential \
            python3-xlib python3-pip \
            libcapstone-dev \
            libsdl2-dev libsdl2-image-dev \
            libfluidsynth-dev fluidsynth \
            xvfb \
            libpng-dev libspeexdsp-dev libasound2-dev \
            cmake ninja-build nasm

      - name: Install Python requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Extra packages used by tests, keypress, and Ollama OpenAI-compat client
          pip install python-xlib capstone openai

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Confirm server is up (systemd starts it automatically)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/ >/dev/null 2>&1; then
              echo "✓ Ollama server is up (attempt $i)"
              break
            fi
            echo "  waiting for Ollama… ($i/30)"
            sleep 2
          done
          ollama --version

      - name: Pull small coding models (supervisor + 2 workers)
        run: |
          # Pull three small CPU-friendly models in sequence
          # qwen2.5-coder:1.5b  — Supervisor  (~986 MB)
          # qwen2.5:1.5b        — Worker A    (~986 MB)
          # tinyllama:latest    — Worker B    (~637 MB)
          ollama pull qwen2.5-coder:1.5b
          ollama pull qwen2.5:1.5b
          ollama pull tinyllama
          ollama list

      - name: Smoke-test each model
        run: |
          ollama run qwen2.5-coder:1.5b "Reply with the single word: READY"
          ollama run qwen2.5:1.5b       "Reply with the single word: READY"
          ollama run tinyllama          "Reply with the single word: READY"
        timeout-minutes: 5

      - name: Install keypress tool
        run: |
          git clone --depth=1 https://github.com/EdgeOfAssembly/keypress.git tools/keypress
          chmod +x tools/keypress/keypress.py
          # Put on PATH via /tmp/bin
          mkdir -p /tmp/bin
          ln -sf "$PWD/tools/keypress/keypress.py" /tmp/bin/keypress.py
          echo "/tmp/bin" >> $GITHUB_PATH

      - name: Build dumpexe
        run: |
          git clone --depth=1 https://github.com/EdgeOfAssembly/dumpexe.git tools/dumpexe
          if command -v g++ &>/dev/null; then
            make -s -C tools/dumpexe CXX=g++ || true
          fi
          if [ -x tools/dumpexe/dumpexe ]; then
            ln -sf "$PWD/tools/dumpexe/dumpexe" /tmp/bin/dumpexe
            echo "dumpexe built successfully"
          else
            echo "::warning::dumpexe build failed; RE tests will be skipped"
          fi

      - name: Run structural test suite
        run: |
          export PATH="/tmp/bin:$PATH"
          python3 tests/test_end_to_end.py

      - name: Run live feature matrix (Ollama required)
        run: python3 tests/test_live_feature_matrix.py
        timeout-minutes: 30

      - name: Run skills manager tests
        run: python3 tests/test_skills_manager.py

      - name: Run socket interface tests
        run: python3 tests/test_socket_interface.py || true

      - name: Run workshop tests
        run: python3 tests/test_workshop.py || true

